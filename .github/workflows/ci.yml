name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + jest + server + bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
      - run: npm test
      - run: npm run server:test
      # Atrapa imports rotos y errores de Metro que typecheck/Jest no ven.
      - name: Bundle Android (sin emitir el resultado)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          FIREBASE_API_KEY: ci-placeholder

  firestore-rules:
    name: reglas + 2 usuarios (Firebase Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:emulator
